; ================================================================
; ESP8266 固件下载器 —— PlatformIO 工程
;
; 【为什么 platform 是 espressif8266 而不是 espressif32】
;   espressif32 平台只提供 ESP32 系列开发板，编译不出 ESP8266 固件。
;   ESP8266 必须用 espressif8266 平台（xtensa-lx106 工具链）。
;   本机已装：espressif8266 @ 4.2.1
;
; 【为什么 board 是 nodemcuv2 而不是 esp8266d】
;   espressif8266 @ 4.2.1 的 boards/ 目录里没有 esp8266d.json，
;   只有 nodemcuv2.json：4MB Flash，ldscript = eagle.flash.4m1m.ld。
;   那 1MB 文件系统区正好用来放 LittleFS（暂存一份待升级固件）。
;
; 【为什么不开 TLS】
;   ESP8266 只有 40KB 级别可用 RAM，完整 BearSSL TLS 栈会吃掉一大半。
;   固件直链走明文 http（详见 README 的「nginx 矛盾」一节）。
; ================================================================

[env:esp8266_ota]
platform = espressif8266
board = nodemcuv2
; ⚠ 为什么不用 esp8266-rtos-sdk（本机已装 1.5.0-beta.5，试过了）：
;   加上它，xtensa-lx106 gcc 10.3 编 Arduino 核心 3.1.2 的 core_esp8266_version.h
;   会直接报 "internal compiler error: in bot_manip, at cp/tree.c:3055"
;   ——核心头文件里那张 section 属性字符串表触发的 GCC bug，-O1/-O2 都绕不过。
;   所以这台下载器用 NONOS SDK，任务层用自写的协作式调度器（src/sched.h，
;   接口仿 xQueueSend/xQueueReceive），功能等价、只是没有抢占。
;   真要 FreeRTOS 只能换 ESP-IDF 重写（代价远大于收益）。
;   ⚖ 这个节点只是"下载器"，一次只干一件事，用不着抢占式调度；
;      真正需要 FreeRTOS 的是 STM32（多传感器+低功耗）和 S3（LVGL+WiFi），
;      那两个都是货真价实的 FreeRTOS。
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; PubSubClient：MQTT over WebSocket
; ArduinoJson：解析云端下发的升级指令（url / ver / sha256 / size）
; ArduinoWebsockets：给 PubSubClient 提供一条 WebSocket 载体
; ⚠ 下面还有一个 esp8266_ota_min（精简版），它会把后两个库整个去掉。
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7
    gilmaimon/ArduinoWebsockets@^0.5.4

build_flags =
    ; 调试信息关掉，省 flash（ESP8266 的 flash 留给 LittleFS 的话更紧张）
    -D NDEBUG
    -D CORE_DEBUG_LEVEL=0
    ; MQTT 收发的最大包长。状态上报的 JSON 很小，512 足够。
    -D MQTT_MAX_PACKET_SIZE=512
    ; ESP8266 没有 PROGMEM，JSON 走 PROGMEM 那条路是纯浪费
    -D ARDUINOJSON_ENABLE_PROGMEM=0

; ================================================================
; 精简版：砍掉 MQTT 通道，只做「下载固件 + 串口推给 STM32」
; ================================================================
; 为什么能砍：8266 的 OTA 指令本来就是走 HTTP /api/iot/config 拉的
; （ota_task 一直在轮询），MQTT 在这个节点上只负责「上报下载进度」。
; 省下来：flash ~40KB（PubSubClient + ArduinoWebsockets 不再链接）
;           RAM  ~10KB（WebSocket 环形缓冲 + PubSubClient 的 packet buffer）
; 代价：后台看不到 8266 的实时进度，只剩串口日志能看到。
;
; 编译：pio run -e esp8266_ota_min          （精简）
;       pio run -e esp8266_ota              （完整，带 MQTT 状态上报）
; 两版的 OTA 推送流程完全一样，只是少了进度上报。
[env:esp8266_ota_min]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson@^7
build_flags =
    -D NDEBUG
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINOJSON_ENABLE_PROGMEM=0
    -D OTA_MINIMAL
